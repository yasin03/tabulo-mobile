<!doctype html>
<html lang="tr">
<head>

<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #16202B; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 52px 20px 16px">

      <span style="font-size: 16px; font-weight: 700">Cari detay</span>

    <div style="display: flex; align-items: center; gap: 14px">

        <span style="font-size: 20px; font-weight: 800">Ahmet Yılmaz</span>
        <span style="font-size: 13px; color: #5B6472">Müşteri · 0532 000 00 00</span>

    </div>

    <div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 13px; color: #5B6472">Size borçlu</span>
          <span style="font-size: 32px; font-weight: 800; letter-spacing: -0.02em; color: #15803D">+ ₺4.500</span>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">

        <button style="height: 48px; border: 2px solid #F2A93B; border-radius: 14px; background: #FFFFFF; color: #16202B; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#B26B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>Hatırlat</button>
      </div>
    </div>

    <div style="background: #E9ECF1; border-radius: 14px; padding: 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <button style="height: 38px; border: none; border-radius: 11px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #1E3A5F; box-shadow: 0 1px 3px rgba(22,32,43,0.12)">Tümü</button>
      <button style="height: 38px; border: none; border-radius: 11px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #5B6472">Satışlar</button>
      <button style="height: 38px; border: none; border-radius: 11px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #5B6472">Tahsilatlar</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700; color: #5B6472; letter-spacing: 0.04em; text-transform: uppercase">Ekim 2026</span>
      <div style="background: #FFFFFF; border-radius: 18px; border: 1px solid #E3E6EB; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #EEF0F3">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #EAF0F7; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1E3A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg></span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Boya badana</span><span style="font-size: 12px; color: #5B6472">Satış · 15 Eki</span></div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 15px; font-weight: 800">+ ₺3.000</span><span style="font-size: 11px; color: #6B7482">Bakiye ₺4.500</span></div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #EEF0F3">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #E7F5EC; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#15803D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Nakit tahsilat</span><span style="font-size: 12px; color: #5B6472">Tahsilat · 12 Eki</span></div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 15px; font-weight: 800; color: #15803D">− ₺1.500</span><span style="font-size: 11px; color: #6B7482">Bakiye ₺1.500</span></div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #EAF0F7; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1E3A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg></span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Mutfak tadilatı</span><span style="font-size: 12px; color: #5B6472">Satış · 2 Eki</span></div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 15px; font-weight: 800">+ ₺3.000</span><span style="font-size: 11px; color: #6B7482">Bakiye ₺3.000</span></div>
        </div>
      </div>
    </div>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #E3E6EB; padding: 12px 20px 30px">
    <button style="width: 100%; height: 54px; border: none; border-radius: 16px; background: #F2A93B; color: #16202B; font-family: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#16202B" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>İşlem ekle</button>
  </div>
</div>

</html>
